<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>CineTest</title>
<style>
:root{--bg:#080a0f;--panel:#11141b;--soft:#171b24;--text:#f4f7fb;--muted:#9aa3b2;--accent:#7c5cff;--line:#232936;--danger:#ff5b6e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
body{min-height:100vh;padding-bottom:82px}.app{max-width:900px;margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(8,10,15,.9);backdrop-filter:blur(14px);padding:16px 16px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.head{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#7c5cff,#281f68);display:grid;place-items:center;font-weight:900;font-size:20px}
.title{font-size:20px;font-weight:800}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.search{margin-top:12px;display:flex;gap:8px}.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:12px 14px;outline:none}
.hero{margin:16px;border-radius:24px;padding:22px;background:radial-gradient(circle at 15% 20%,rgba(124,92,255,.34),transparent 40%),linear-gradient(135deg,#141824,#0c0f15);border:1px solid var(--line);min-height:170px;display:flex;flex-direction:column;justify-content:flex-end}
.hero b{font-size:26px}.hero p{color:var(--muted);margin:8px 0 0;line-height:1.8}.status{font-size:12px;margin-top:12px;color:var(--muted)}
.section{padding:2px 16px 18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0}.section-head h2{font-size:18px;margin:0}.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.18s transform,.18s border-color}.card:active{transform:scale(.985)}.card:hover{border-color:#3a4151}
.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#222838,#10131a);position:relative;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster .ph{position:absolute;inset:0;display:grid;place-items:center;color:#687084;font-size:12px}.info{padding:10px}.name{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:30px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(10,12,17,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.bottom .inner{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:14px;font:inherit}.nav.active{color:#fff;background:var(--soft)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:900px;margin:auto;background:#0d1016;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding-bottom:24px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;background:rgba(13,16,22,.94);backdrop-filter:blur(12px);z-index:3}.close{border:0;background:var(--soft);color:#fff;width:38px;height:38px;border-radius:12px;font-size:20px}
.detail{padding:0 16px}.detail h2{margin:8px 0}.detail p{color:var(--muted);line-height:1.85}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{font-size:12px;padding:7px 10px;border-radius:999px;background:var(--soft);color:#cbd2dc}
.play{width:100%;border:0;border-radius:14px;padding:13px;background:var(--accent);color:white;font-weight:800;font:inherit;margin-top:14px}.season-tabs{display:flex;gap:8px;overflow:auto;margin:16px 0 10px}.season-btn{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:12px;padding:9px 12px}.season-btn.active{background:var(--accent);border-color:var(--accent)}
.episodes{display:grid;gap:8px}.episode{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:11px 12px;border-radius:14px}.episode button{border:0;background:var(--soft);color:#fff;border-radius:10px;padding:8px 10px}
.player-modal{position:fixed;inset:0;z-index:70;background:#000;display:none;align-items:center;justify-content:center}.player-modal.open{display:flex}.player-wrap{width:100%;max-width:1100px}.player-top{display:flex;justify-content:space-between;align-items:center;padding:12px;color:white}.player{width:100%;max-height:80vh;background:#000}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="head"><div class="logo">C</div><div><div class="title">CineTest</div><div class="subtitle">Telegram + Supabase Prototype</div></div></div>
    <div class="search"><input id="search" placeholder="ابحث عن فيلم أو مسلسل"></div>
  </header>

  <section class="hero">
    <b>مكتبتك التجريبية</b>
    <p>أضف المحتوى من بوت Telegram وسيظهر هنا تلقائيًا.</p>
    <div class="status" id="status">جاري فحص الاتصال...</div>
  </section>

  <main>
    <section class="section page" id="page-home">
      <div class="section-head"><h2>أحدث الأفلام</h2><span class="count" id="movieCount"></span></div>
      <div class="grid" id="homeMovies"></div>
      <div class="section-head" style="margin-top:22px"><h2>المسلسلات</h2><span class="count" id="seriesCount"></span></div>
      <div class="grid" id="homeSeries"></div>
    </section>

    <section class="section page hidden" id="page-movies">
      <div class="section-head"><h2>كل الأفلام</h2><span class="count"></span></div>
      <div class="grid" id="allMovies"></div>
    </section>

    <section class="section page hidden" id="page-series">
      <div class="section-head"><h2>كل المسلسلات</h2><span class="count"></span></div>
      <div class="grid" id="allSeries"></div>
    </section>
  </main>
</div>

<nav class="bottom"><div class="inner">
  <button class="nav active" data-page="home">الرئيسية</button>
  <button class="nav" data-page="movies">الأفلام</button>
  <button class="nav" data-page="series">المسلسلات</button>
</div></nav>

<div class="modal" id="detailModal"><div class="sheet">
  <div class="sheet-head"><strong>التفاصيل</strong><button class="close" id="closeDetail">×</button></div>
  <div class="detail" id="detailBody"></div>
</div></div>

<div class="player-modal" id="playerModal"><div class="player-wrap">
  <div class="player-top"><strong id="playerTitle">تشغيل</strong><button class="close" id="closePlayer">×</button></div>
  <video id="player" class="player" controls playsinline preload="metadata"></video>
</div></div>

<script>
const SUPABASE_URL="https://uaphmjpnxrzvvhalpobr.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_E1vr67zwi5R25xvr5righw_Z_JA6CeF";
const GATEWAY=SUPABASE_URL+"/functions/v1/telegram-gateway";

const state={movies:[],series:[],query:""};
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

async function rest(table,query){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+table+"?"+query,{headers:{apikey:PUBLISHABLE_KEY,Accept:"application/json"}});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function poster(type,id){return GATEWAY+"?media="+type+"&id="+encodeURIComponent(id)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function card(item,type){
  const posterType=type==="movie"?"movie_poster":"series_poster";
  const label=type==="movie"?"فيلم":"مسلسل";
  return `<article class="card" data-type="${type}" data-id="${item.id}">
    <div class="poster"><div class="ph">${label}</div><img src="${poster(posterType,item.id)}" alt="" loading="lazy" onerror="this.style.display='none'"></div>
    <div class="info"><div class="name">${esc(item.title)}</div><div class="meta">${esc(item.release_year||"")} ${item.genre?"• "+esc(item.genre):""}</div></div>
  </article>`;
}
function filtered(list){const q=state.query.trim().toLowerCase();return q?list.filter(x=>(x.title+" "+(x.genre||"")).toLowerCase().includes(q)):list}
function render(){
  const movies=filtered(state.movies), series=filtered(state.series);
  $("#movieCount").textContent=state.movies.length+" فيلم";
  $("#seriesCount").textContent=state.series.length+" مسلسل";
  $("#homeMovies").innerHTML=(movies.slice(0,6).map(x=>card(x,"movie")).join(""))||'<div class="empty">لا توجد أفلام بعد. أضف أول فيلم من البوت.</div>';
  $("#homeSeries").innerHTML=(series.slice(0,6).map(x=>card(x,"series")).join(""))||'<div class="empty">لا توجد مسلسلات بعد.</div>';
  $("#allMovies").innerHTML=(movies.map(x=>card(x,"movie")).join(""))||'<div class="empty">لا توجد نتائج.</div>';
  $("#allSeries").innerHTML=(series.map(x=>card(x,"series")).join(""))||'<div class="empty">لا توجد نتائج.</div>';
  $$(".card").forEach(el=>el.onclick=()=>openDetail(el.dataset.type,el.dataset.id));
}
async function load(){
  try{
    const [m,s]=await Promise.all([
      rest("movies","select=id,title,description,release_year,genre,created_at&is_published=eq.true&order=created_at.desc"),
      rest("series","select=id,title,description,release_year,genre,created_at&is_published=eq.true&order=created_at.desc")
    ]);
    state.movies=m;state.series=s;render();
  }catch(e){
    $("#status").textContent="تعذر قراءة قاعدة البيانات";
    console.error(e);
  }
}
async function health(){
  try{
    const r=await fetch(GATEWAY+"?health=1"); const j=await r.json();
    $("#status").textContent=j.botConfigured&&j.secretConfigured?"البوت والبوابة جاهزان":"واجهة التطبيق جاهزة — أكمل إعداد Secrets في Supabase";
  }catch{$("#status").textContent="واجهة التطبيق جاهزة — بوابة Telegram غير منشورة بعد";}
}
function openPlayer(title,src){
  $("#playerTitle").textContent=title;
  $("#player").src=src;
  $("#playerModal").classList.add("open");
  $("#player").play().catch(()=>{});
}
function closePlayer(){
  const v=$("#player");v.pause();v.removeAttribute("src");v.load();$("#playerModal").classList.remove("open");
}
async function openDetail(type,id){
  const item=(type==="movie"?state.movies:state.series).find(x=>x.id===id); if(!item)return;
  $("#detailModal").classList.add("open");
  if(type==="movie"){
    $("#detailBody").innerHTML=`<h2>${esc(item.title)}</h2><div class="tags"><span class="tag">${esc(item.release_year||"—")}</span><span class="tag">${esc(item.genre||"غير مصنف")}</span></div><p>${esc(item.description||"لا يوجد وصف.")}</p><button class="play" id="playMovie">مشاهدة الآن</button>`;
    $("#playMovie").onclick=()=>openPlayer(item.title,GATEWAY+"?media=movie_video&id="+item.id);
    return;
  }
  $("#detailBody").innerHTML=`<h2>${esc(item.title)}</h2><div class="tags"><span class="tag">${esc(item.release_year||"—")}</span><span class="tag">${esc(item.genre||"غير مصنف")}</span></div><p>${esc(item.description||"لا يوجد وصف.")}</p><div class="season-tabs" id="seasonTabs"></div><div class="episodes" id="episodes"><div class="empty">جاري تحميل الحلقات...</div></div>`;
  try{
    const seasons=await rest("seasons","select=id,season_number,title&series_id=eq."+id+"&order=season_number.asc");
    if(!seasons.length){$("#episodes").innerHTML='<div class="empty">لا توجد حلقات بعد.</div>';return}
    $("#seasonTabs").innerHTML=seasons.map((s,i)=>`<button class="season-btn ${i===0?"active":""}" data-id="${s.id}">${esc(s.title||("الموسم "+s.season_number))}</button>`).join("");
    async function showEpisodes(seasonId,btn){
      $$(".season-btn").forEach(b=>b.classList.remove("active"));btn?.classList.add("active");
      $("#episodes").innerHTML='<div class="empty">جاري التحميل...</div>';
      const eps=await rest("episodes","select=id,episode_number,title,description&season_id=eq."+seasonId+"&is_published=eq.true&order=episode_number.asc");
      $("#episodes").innerHTML=eps.length?eps.map(e=>`<div class="episode"><div><strong>${esc(e.title||("الحلقة "+e.episode_number))}</strong><div class="meta">الحلقة ${e.episode_number}</div></div><button data-ep="${e.id}" data-title="${esc(e.title||("الحلقة "+e.episode_number))}">تشغيل</button></div>`).join(""):'<div class="empty">لا توجد حلقات.</div>';
      $$("#episodes button[data-ep]").forEach(b=>b.onclick=()=>openPlayer(b.dataset.title,GATEWAY+"?media=episode_video&id="+b.dataset.ep));
    }
    $$(".season-btn").forEach(b=>b.onclick=()=>showEpisodes(b.dataset.id,b));
    await showEpisodes(seasons[0].id,$(".season-btn"));
  }catch(e){$("#episodes").innerHTML='<div class="empty">تعذر تحميل الحلقات.</div>';console.error(e)}
}
$("#closeDetail").onclick=()=>$("#detailModal").classList.remove("open");
$("#detailModal").onclick=e=>{if(e.target.id==="detailModal")$("#detailModal").classList.remove("open")};
$("#closePlayer").onclick=closePlayer;
$("#playerModal").onclick=e=>{if(e.target.id==="playerModal")closePlayer()};
$("#search").oninput=e=>{state.query=e.target.value;render()};
$$(".nav").forEach(b=>b.onclick=()=>{
  $$(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  $$(".page").forEach(x=>x.classList.add("hidden"));$("#page-"+b.dataset.page).classList.remove("hidden");
  scrollTo({top:0,behavior:"smooth"});
});
load();health();
</script>
</body>
</html>
